<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PFX — Pizza Automation Experts</title>
    <link rel="icon" type="image/svg+xml" href="public/landing-pages/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="public/landing-pages/favicon-32.png" />
    <script>
      /* The React app below only runs under the Vite dev server (npm run dev on
         localhost). Anywhere else — double-clicked from disk, or hosted as plain
         files on GitHub Pages — go straight to the page itself, which runs as is. */
      if (location.protocol === "file:" || !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))
        location.replace("public/landing-pages/index.html" + location.hash);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
